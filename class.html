<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
           font-family: Arial, sans-serif; 
        }
        body{
          background-color: rgb(50, 50, 168); 
          display: flex;
          align-items: center;
          min-height: 49vh;
          padding-top:50px ;
          
        }
         header{
            text-align: center;
            padding: 30px 0;
            color: aliceblue;
            font-size: 40px;
            font-weight: bolder;
           margin-bottom: 30px;
         }
         nav{
            display: flex;
            justify-content: center;
         }
         nav ul{
           position: relative; 
           display: flex;
           background: #e0dbdb;
           padding: 15px 40px;
           border-radius: 10px;
           gap: 40px;
           background-color: rgb(2, 27, 27);
         }
         nav ul li{
            list-style: none;
         }
         nav ul li a{
            color: rgb(177, 70, 8);
            text-decoration: none;
            font-size: 20px;
            padding: 10px 20px;
            position: relative;
            z-index: 1;
            border-radius: 6px;
            display: block
         }
    </style>
</head>
<body>
    <header>Lens Polytechnic Blog</header>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
